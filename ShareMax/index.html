<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ShareMax — Ultra Fast P2P Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-emerald-500 selection:text-zinc-950">

    <!-- Top Bar: Lang Switcher -->
    <div class="w-full max-w-md flex justify-end pt-2">
        <button id="lang-btn" onclick="toggleLang()" class="text-xs font-semibold bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-3 py-1.5 rounded-full text-zinc-300 transition-all">
            🌐 EN / <span class="text-emerald-400">CS</span>
        </button>
    </div>

    <!-- Main Card -->
    <div class="max-w-md w-full bg-zinc-900/90 backdrop-blur-xl border border-zinc-800/80 rounded-3xl p-8 shadow-2xl shadow-emerald-950/30 my-auto">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-zinc-950 font-bold text-xl shadow-lg shadow-emerald-500/20 mb-3">
                ⚡
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Share<span class="text-emerald-400">Max</span></h1>
            <p id="t-tagline" class="text-zinc-400 text-xs mt-1">Globální P2P Engine &bull; 24h auto-mazání</p>
        </div>

        <!-- Sender UI -->
        <div id="sender-view">
            <div id="drop-zone" class="border-2 border-dashed border-zinc-800 hover:border-emerald-500 bg-zinc-950/60 hover:bg-zinc-950 rounded-2xl p-6 text-center cursor-pointer transition-all mb-5">
                <input type="file" id="file-input" class="hidden">
                <div id="drop-text" class="space-y-2">
                    <p id="t-drop" class="font-semibold text-sm text-zinc-200">Klepni nebo přetáhni soubor</p>
                    <p id="t-subdrop" class="text-[11px] text-zinc-500">Okamžitý přenos bez limitu velikosti</p>
                </div>
                <div id="file-info" class="hidden space-y-1">
                    <p id="file-name" class="font-semibold text-emerald-400 text-sm truncate max-w-xs mx-auto"></p>
                    <p id="file-size" class="text-[11px] text-zinc-500"></p>
                </div>
            </div>

            <div id="qr-box" class="hidden flex flex-col items-center bg-zinc-950 border border-zinc-800/80 p-4 rounded-2xl mb-4 space-y-3">
                <div id="qrcode" class="bg-white p-2.5 rounded-xl"></div>
                <input type="text" id="share-url" readonly class="w-full bg-zinc-900 border border-zinc-800 text-[11px] text-zinc-300 px-3 py-2 rounded-xl text-center select-all focus:outline-none">
            </div>
        </div>

        <!-- Receiver UI -->
        <div id="receiver-view" class="hidden text-center space-y-4">
            <div class="bg-zinc-950 border border-zinc-800/80 p-6 rounded-2xl space-y-3">
                <p id="rx-status" class="font-semibold text-emerald-400 text-sm">Navazuji globální tunel...</p>
                <!-- Progress bar pro stahování -->
                <div id="progress-container" class="hidden w-full bg-zinc-900 rounded-full h-2 overflow-hidden border border-zinc-800">
                    <div id="progress-bar" class="bg-emerald-400 h-full w-0 transition-all duration-150"></div>
                </div>
                <a id="dl-btn" class="hidden w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-3 px-4 rounded-xl transition-all block text-center text-sm shadow-lg shadow-emerald-500/20">
                    Stáhnout soubor
                </a>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="text-center">
            <span id="status-badge" class="inline-flex items-center gap-2 text-[11px] font-medium text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="t-ready">Připraveno</span>
            </span>
        </div>
    </div>

    <!-- Footer Spacer -->
    <div class="w-full max-w-md pb-2"></div>

    <script>
        let currentLang = 'cs';
        const dict = {
            cs: {
                tagline: "Globální P2P Engine • 24h auto-mazání",
                drop: "Klepni nebo přetáhni soubor",
                subdrop: "Okamžitý přenos bez limitu velikosti",
                ready: "Připraveno",
                waiting: "Čeká se na spojení...",
                sending: "Odesílám napřímo...",
                sent: "Odesláno maximální rychlostí",
                rxConnecting: "Navazuji globální tunel...",
                rxActive: "Tunel aktivní, stahuji data...",
                rxReady: (name) => `Soubor "${name}" je připraven!`,
                downloadBtn: "Uložit soubor",
                expired: "Platnost odkazu vypršela (24h limit)."
            },
            en: {
                tagline: "Global P2P Engine • 24h Auto-Expire",
                drop: "Click or drop a file here",
                subdrop: "Instant transfer with no size limits",
                ready: "Ready",
                waiting: "Waiting for connection...",
                sending: "Streaming directly...",
                sent: "Transferred at max speed",
                rxConnecting: "Establishing global tunnel...",
                rxActive: "Tunnel active, downloading data...",
                rxReady: (name) => `File "${name}" is ready!`,
                downloadBtn: "Save File",
                expired: "Link has expired (24h limit reached)."
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            updateTexts();
        }

        function updateTexts() {
            const t = dict[currentLang];
            document.getElementById('t-tagline').textContent = t.tagline;
            document.getElementById('t-drop').textContent = t.drop;
            document.getElementById('t-subdrop').textContent = t.subdrop;
            document.getElementById('t-ready').textContent = t.ready;
            const dlBtn = document.getElementById('dl-btn');
            if(!dlBtn.classList.contains('hidden')) dlBtn.textContent = t.downloadBtn;
        }

        const params = new URLSearchParams(window.location.search);
        const peerId = params.get('p');
        const timestamp = params.get('t');
        const fileNameParam = params.get('name');

        if (fileNameParam) {
            document.title = `${decodeURIComponent(fileNameParam)} — ShareMax`;
        }

        if (timestamp) {
            if (Date.now() - parseInt(timestamp, 10) > 86400000) {
                document.getElementById('sender-view').classList.add('hidden');
                document.getElementById('receiver-view').classList.remove('hidden');
                document.getElementById('rx-status').textContent = dict[currentLang].expired;
                throw new Error("Expired");
            }
        }

        // ULTRA-OPTIMIZED PEER CONFIG WITH STUN/TURN FALLBACKS FOR GLOBAL SPEED
        const peer = new Peer({
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun.services.mozilla.com' }
                ]
            }
        });

        const senderView = document.getElementById('sender-view');
        const receiverView = document.getElementById('receiver-view');
        const statusBadge = document.getElementById('status-badge');

        peer.on('open', (id) => {
            if (peerId) {
                senderView.classList.add('hidden');
                receiverView.classList.remove('hidden');
                document.getElementById('progress-container').classList.remove('hidden');

                const conn = peer.connect(peerId, { reliable: true, serialization: 'binary' });
                let incomingBuffer = [];
                let receivedSize = 0;
                let totalFileSize = 0;
                let targetFileName = "file";

                conn.on('open', () => {
                    document.getElementById('rx-status').textContent = dict[currentLang].rxActive;
                });

                conn.on('data', (data) => {
                    // Metadatový balíček nebo chunk dat
                    if (data.type === 'meta') {
                        totalFileSize = data.size;
                        targetFileName = data.name;
                    } else if (data.type === 'chunk') {
                        incomingBuffer.push(data.payload);
                        receivedSize += data.payload.byteLength;
                        
                        if (totalFileSize > 0) {
                            const percent = Math.round((receivedSize / totalFileSize) * 100);
                            document.getElementById('progress-bar').style.width = percent + '%';
                            document.getElementById('rx-status').textContent = `${dict[currentLang].rxActive} (${percent}%)`;
                        }

                        if (receivedSize === totalFileSize) {
                            const blob = new Blob(incomingBuffer);
                            const url = URL.createObjectURL(blob);
                            const btn = document.getElementById('dl-btn');
                            
                            document.getElementById('progress-container').classList.add('hidden');
                            btn.href = url;
                            btn.download = targetFileName;
                            btn.textContent = dict[currentLang].downloadBtn;
                            btn.classList.remove('hidden');
                            
                            document.getElementById('rx-status').textContent = dict[currentLang].rxReady(targetFileName);
                            statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> ${dict[currentLang].ready}`;
                        }
                    }
                });
            } else {
                const dropZone = document.getElementById('drop-zone');
                const fileInput = document.getElementById('file-input');
                
                dropZone.onclick = () => fileInput.click();
                fileInput.onchange = (e) => { if (e.target.files[0]) initShare(e.target.files[0], id); };

                dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-emerald-500'); };
                dropZone.ondragleave = () => dropZone.classList.remove('border-emerald-500');
                dropZone.ondrop = (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('border-emerald-500');
                    if (e.dataTransfer.files[0]) initShare(e.dataTransfer.files[0], id);
                };
            }
        });

        function initShare(file, myId) {
            document.getElementById('drop-text').classList.add('hidden');
            document.getElementById('file-info').classList.remove('hidden');
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-size').textContent = (file.size / (1024 * 1024)).toFixed(2) + " MB";

            const shareUrl = `${window.location.origin}${window.location.pathname}?p=${myId}&t=${Date.now()}&name=${encodeURIComponent(file.name)}`;
            
            document.getElementById('qr-box').classList.remove('hidden');
            document.getElementById('share-url').value = shareUrl;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: shareUrl, width: 130, height: 130, colorDark: "#09090b", colorLight: "#ffffff"
            });

            statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ${dict[currentLang].waiting}`;

            peer.on('connection', (conn) => {
                statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ${dict[currentLang].sending}`;
                
                conn.on('open', async () => {
                    // 1. Pošleme metadata o souboru
                    conn.send({ type: 'meta', name: file.name, size: file.size });

                    // 2. Odesíláme po 64KB chunkech pro maximální propustnost sítě
                    const CHUNK_SIZE = 64 * 1024;
                    let offset = 0;

                    while (offset < file.size) {
                        const slice = file.slice(offset, offset + CHUNK_SIZE);
                        const buffer = await slice.arrayBuffer();
                        conn.send({ type: 'chunk', payload: buffer });
                        offset += CHUNK_SIZE;
                    }

                    statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> ${dict[currentLang].sent}`;
                });
            });
        }
    </script>
</body>
</html>
