<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMax — Okamžité P2P sdílení</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS pro okamžité a rychlé P2P spojení -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500 selection:text-zinc-950">

    <div class="max-w-md w-full bg-zinc-900/80 backdrop-blur-xl border border-zinc-800/80 rounded-3xl p-8 shadow-2xl shadow-emerald-950/20">
        
        <!-- Branding Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-zinc-950 font-bold text-2xl shadow-lg shadow-emerald-500/20 mb-4">
                ⚡
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">Share<span class="text-emerald-400">Max</span></h1>
            <p id="brand-tagline" class="text-zinc-400 text-sm mt-1">Okamžitý P2P přenos souborů</p>
        </div>

        <!-- Odesílatel -->
        <div id="sender-section">
            <div id="drop-zone" class="group border-2 border-dashed border-zinc-800 hover:border-emerald-500/50 bg-zinc-950/50 hover:bg-zinc-950 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 mb-6">
                <input type="file" id="file-input" class="hidden">
                <div id="drop-text" class="space-y-3">
                    <div class="w-12 h-12 mx-auto rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 group-hover:text-emerald-400 group-hover:scale-110 transition-all duration-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="font-semibold text-zinc-200">Vyber soubor pro sdílení</p>
                        <p class="text-xs text-zinc-500 mt-1">Generování QR kódu proběhne okamžitě</p>
                    </div>
                </div>
                <div id="file-info" class="hidden space-y-1">
                    <p id="file-name" class="font-semibold text-emerald-400 truncate max-w-xs mx-auto"></p>
                    <p id="file-size" class="text-xs text-zinc-500"></p>
                </div>
            </div>

            <div id="qr-container" class="hidden flex flex-col items-center bg-zinc-950 border border-zinc-800/80 p-5 rounded-2xl mb-6 space-y-4">
                <p class="text-xs font-medium text-zinc-400 uppercase tracking-wider">Naskenuj pro stažení</p>
                <div id="qrcode" class="bg-white p-3 rounded-xl shadow-inner"></div>
                <input type="text" id="share-link-input" readonly class="w-full bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 px-3 py-2.5 rounded-xl text-center select-all">
            </div>
        </div>

        <!-- Příjemce -->
        <div id="receiver-section" class="hidden text-center space-y-4">
            <div class="bg-zinc-950 border border-zinc-800/80 p-6 rounded-2xl space-y-4">
                <p class="text-xs text-zinc-400 uppercase tracking-wider">Příchozí soubor</p>
                <p id="incoming-status" class="font-semibold text-emerald-400 text-sm">Navazuje se rychlé P2P spojení...</p>
                <a id="download-btn" class="hidden w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-3.5 px-4 rounded-xl transition-all duration-300 block text-center shadow-lg shadow-emerald-500/20">
                    Stáhnout soubor
                </a>
            </div>
        </div>

        <!-- Status bar -->
        <div class="mt-2 text-center">
            <span id="status-box" class="inline-flex items-center gap-2 text-xs font-medium text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Připraveno
            </span>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('peer');

        const senderSection = document.getElementById('sender-section');
        const receiverSection = document.getElementById('receiver-section');
        const statusBox = document.getElementById('status-box');
        const brandTagline = document.getElementById('brand-tagline');

        // Inicializace PeerJS uzlu
        const peer = new Peer();

        peer.on('open', (id) => {
            if (targetPeerId) {
                // Režim příjemce: automaticky se připojí k odesílateli
                senderSection.classList.add('hidden');
                receiverSection.classList.remove('hidden');
                brandTagline.textContent = "Stahování souboru napřímo";
                
                const conn = peer.connect(targetPeerId);
                
                conn.on('open', () => {
                    document.getElementById('incoming-status').textContent = "Spojení navázáno! Čekám na data...";
                });

                conn.on('data', (data) => {
                    if (data.file) {
                        const blob = new Blob([data.file]);
                        const url = URL.createObjectURL(blob);
                        const downloadBtn = document.getElementById('download-btn');
                        
                        downloadBtn.href = url;
                        downloadBtn.download = data.name;
                        downloadBtn.classList.remove('hidden');
                        
                        document.getElementById('incoming-status').textContent = `Soubor "${data.name}" je připraven ke stažení!`;
                        statusBox.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Přenos dokončen';
                    }
                });
            } else {
                // Režim odesílatele
                const dropZone = document.getElementById('drop-zone');
                const fileInput = document.getElementById('file-input');
                const dropText = document.getElementById('drop-text');
                const fileInfo = document.getElementById('file-info');
                const fileName = document.getElementById('file-name');
                const fileSize = document.getElementById('file-size');
                const qrContainer = document.getElementById('qr-container');

                dropZone.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files.length) handleFile(e.target.files[0]);
                });

                function handleFile(file) {
                    dropText.classList.add('hidden');
                    fileInfo.classList.remove('hidden');
                    fileName.textContent = file.name;
                    fileSize.textContent = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;

                    // Okamžité vytvoření URL s ID odesílatele
                    const fullUrl = `${window.location.origin}${window.location.pathname}?peer=${id}`;

                    qrContainer.classList.remove('hidden');
                    document.getElementById('qrcode').innerHTML = "";
                    
                    new QRCode(document.getElementById("qrcode"), {
                        text: fullUrl,
                        width: 148,
                        height: 148,
                        colorDark: "#09090b",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });

                    document.getElementById('share-link-input').value = fullUrl;
                    statusBox.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Čeká se na připojení příjemce...';

                    // Naslouchání na příchozí připojení od příjemce
                    peer.on('connection', (conn) => {
                        statusBox.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Příjemce připojen, odesílám soubor...';
                        
                        conn.on('open', () => {
                            // Okamžité odeslání souboru přes P2P kanál
                            conn.send({
                                file: file,
                                name: file.name
                            });
                            statusBox.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Soubor odeslán';
                        });
                    });
                }
            }
        });
    </script>
</body>
</html>
