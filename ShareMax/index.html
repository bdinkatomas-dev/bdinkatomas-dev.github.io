<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMax — Okamžité P2P sdílení souborů</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500 selection:text-zinc-950">

    <!-- Hlavní kontejner -->
    <div class="max-w-md w-full bg-zinc-900/80 backdrop-blur-xl border border-zinc-800/80 rounded-3xl p-8 shadow-2xl shadow-emerald-950/20">
        
        <!-- Branding Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-zinc-950 font-bold text-2xl shadow-lg shadow-emerald-500/20 mb-4">
                ⚡
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">Share<span class="text-emerald-400">Max</span></h1>
            <p id="brand-tagline" class="text-zinc-400 text-sm mt-1">Bez limitů. Bez cloudu. Napřímo mezi zařízeními.</p>
        </div>

        <!-- Odesílací sekce -->
        <div id="sender-section">
            <div id="drop-zone" class="group border-2 border-dashed border-zinc-800 hover:border-emerald-500/50 bg-zinc-950/50 hover:bg-zinc-950 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 mb-6 relative overflow-hidden">
                <input type="file" id="file-input" class="hidden">
                
                <div id="drop-text" class="space-y-3">
                    <div class="w-12 h-12 mx-auto rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 group-hover:text-emerald-400 group-hover:scale-110 transition-all duration-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="font-semibold text-zinc-200">Přetáhni soubor sem</p>
                        <p class="text-xs text-zinc-500 mt-1">nebo <span class="text-emerald-400 underline underline-offset-2">vyber ze zařízení</span></p>
                    </div>
                </div>

                <div id="file-info" class="hidden space-y-1">
                    <p id="file-name" class="font-semibold text-emerald-400 truncate max-w-xs mx-auto"></p>
                    <p id="file-size" class="text-xs text-zinc-500"></p>
                </div>
            </div>

            <!-- QR Kód & Odkaz box -->
            <div id="qr-container" class="hidden flex flex-col items-center bg-zinc-950 border border-zinc-800/80 p-5 rounded-2xl mb-6 space-y-4 animate-fade-in">
                <p class="text-xs font-medium text-zinc-400 uppercase tracking-wider">Naskenuj pro okamžitý přenos</p>
                <div id="qrcode" class="bg-white p-3 rounded-xl shadow-inner"></div>
                <div class="w-full">
                    <input type="text" id="share-link-input" readonly class="w-full bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 px-3 py-2.5 rounded-xl text-center select-all focus:outline-none focus:border-emerald-500/50">
                </div>
            </div>
        </div>

        <!-- Přijímací sekce (aktivní při detekci místnosti v URL) -->
        <div id="receiver-section" class="hidden text-center space-y-4">
            <div class="bg-zinc-950 border border-zinc-800/80 p-6 rounded-2xl space-y-3">
                <p class="text-xs text-zinc-400 uppercase tracking-wider">Příchozí soubor</p>
                <p id="incoming-file-info" class="font-semibold text-emerald-400 text-lg">Navazuje se zabezpečený tunel...</p>
                <button id="download-btn" disabled class="w-full bg-zinc-800 text-zinc-500 font-semibold py-3.5 px-4 rounded-xl transition-all duration-300 cursor-not-allowed">
                    Čeká se na data...
                </button>
            </div>
        </div>

        <!-- Status bar -->
        <div class="mt-2 text-center">
            <span id="status-box" class="inline-flex items-center gap-2 text-xs font-medium text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Připraveno k odeslání
            </span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-zinc-600">
        Powered by ShareMax P2P Engine &bull; Zero Server Storage
    </footer>

    <!-- Logika aplikace -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const senderSection = document.getElementById('sender-section');
        const receiverSection = document.getElementById('receiver-section');
        const statusBox = document.getElementById('status-box');
        const brandTagline = document.getElementById('brand-tagline');

        if (roomId) {
            // Režim příjemce
            senderSection.classList.add('hidden');
            receiverSection.classList.remove('hidden');
            brandTagline.textContent = "Příjem souboru napřímo v reálném čase";
            statusBox.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Připojování k odesílateli...';
            
            // Zde proběhne napojení na WebRTC signál pro příjem souboru
        } else {
            // Režim odesílatele
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const dropText = document.getElementById('drop-text');
            const fileInfo = document.getElementById('file-info');
            const fileName = document.getElementById('file-name');
            const fileSize = document.getElementById('file-size');
            const qrContainer = document.getElementById('qr-container');

            dropZone.addEventListener('click', () => fileInput.click());
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-emerald-500', 'bg-zinc-950');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-emerald-500', 'bg-zinc-950');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-emerald-500', 'bg-zinc-950');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                dropText.classList.add('hidden');
                fileInfo.classList.remove('hidden');
                fileName.textContent = file.name;
                fileSize.textContent = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;

                // Generování unikátní URL pro GitHub Pages / statický hosting
                const randomRoom = Math.random().toString(36).substring(2, 9);
                const fullUrl = `${window.location.origin}${window.location.pathname}?room=${randomRoom}`;

                qrContainer.classList.remove('hidden');
                document.getElementById('qrcode').innerHTML = "";
                
                new QRCode(document.getElementById("qrcode"), {
                    text: fullUrl,
                    width: 148,
                    height: 148,
                    colorDark: "#09090b",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });

                document.getElementById('share-link-input').value = fullUrl;
                
                statusBox.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Čeká se na připojení příjemce...';
                
                // Zde se spouští WebRTC vysílání
            }
        }
    </script>
</body>
</html>
