<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hlasový chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f1115;
            color: #f1f3f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1a1d24;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2d3139;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #1d4ed8; }
        input {
            width: 100%;
            padding: 10px;
            background: #0f1115;
            border: 1px solid #2d3139;
            color: white;
            border-radius: 6px;
            margin-top: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .status { margin-top: 15px; font-size: 14px; color: #9ca3af; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Hlasový hovor</h2>
        <div id="setupView">
            <button onclick="startRoom()">Vytvořit místnost</button>
        </div>
        <div id="callView" style="display:none;">
            <p>Odkaz pro druhého účastníka:</p>
            <input type="text" id="shareLink" readonly onclick="this.select()">
        </div>
        <div class="status" id="status">Odpojeno</div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const statusEl = document.getElementById('status');
        const remoteAudio = document.getElementById('remoteAudio');
        let peer, localStream;

        const urlParams = new URLSearchParams(window.location.search);
        const joinId = urlParams.get('join');

        async function getMic() {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            }
            return localStream;
        }

        async function startRoom() {
            statusEl.innerText = 'Inicializace...';
            await getMic();
            
            peer = new Peer();

            peer.on('open', (id) => {
                const link = window.location.origin + window.location.pathname + '?join=' + id;
                document.getElementById('setupView').style.display = 'none';
                document.getElementById('callView').style.display = 'block';
                document.getElementById('shareLink').value = link;
                statusEl.innerText = 'Čeká se na připojení druhé strany...';
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                setupCall(call);
            });
        }

        // Pokud uživatel otevřel odkaz s ?join=ID
        if (joinId) {
            window.addEventListener('load', async () => {
                statusEl.innerText = 'Připojování do místnosti...';
                await getMic();

                peer = new Peer();

                peer.on('open', () => {
                    const call = peer.call(joinId, localStream);
                    setupCall(call);
                });
            });
        }

        function setupCall(call) {
            call.on('stream', (stream) => {
                remoteAudio.srcObject = stream;
                statusEl.innerText = 'Spojeno / Hovor probíhá';
                statusEl.style.color = '#22c55e';
            });

            call.on('close', () => {
                statusEl.innerText = 'Hovor byl ukončen';
            });
        }
    </script>
</body>
</html>
