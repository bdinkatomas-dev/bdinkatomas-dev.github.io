<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo — Voice Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --danger-color: #ff7b72;
            --success-color: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            margin: 10px 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
        }

        .status-dot.connected { background-color: var(--success-color); }
        .status-dot.connecting { background-color: #d29922; }

        .link-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .link-box label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .link-input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--surface-hover);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            width: 100%;
        }

        button:hover {
            border-color: var(--accent-color);
            background-color: var(--border-color);
        }

        button.primary {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            font-weight: 600;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        button.danger {
            background-color: rgba(255, 123, 114, 0.15);
            color: var(--danger-color);
            border-color: rgba(255, 123, 114, 0.3);
        }

        button.danger:hover {
            background-color: rgba(255, 123, 114, 0.25);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">
            <h1>Echo</h1>
            <p>Peer-to-Peer Voice Communication</p>
        </div>

        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Disconnected</span>
        </div>

        <!-- Initial view -->
        <div id="setupView">
            <button class="primary" onclick="createRoom()">Create Room</button>
        </div>

        <!-- Room created view (Host) -->
        <div id="shareView" class="link-box hidden">
            <label>Invitation Link</label>
            <div class="link-input-group">
                <input type="text" id="shareLink" readonly onclick="this.select()">
                <button onclick="copyLink()" style="width: auto;">Copy</button>
            </div>
            <p style="font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: 4px;">Waiting for someone to join...</p>
        </div>

        <!-- Active call controls -->
        <div id="callControls" class="hidden" style="display: flex; flex-direction: column; gap: 10px;">
            <button id="muteBtn" onclick="toggleMute()">Mute Microphone</button>
            <button class="danger" onclick="endCall()">End Call</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const setupView = document.getElementById('setupView');
        const shareView = document.getElementById('shareView');
        const shareLink = document.getElementById('shareLink');
        const callControls = document.getElementById('callControls');
        const muteBtn = document.getElementById('muteBtn');
        const remoteAudio = document.getElementById('remoteAudio');

        let peer = null;
        let localStream = null;
        let activeCall = null;

        const urlParams = new URLSearchParams(window.location.search);
        const joinId = urlParams.get('join');

        function setStatus(text, state) {
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + state;
        }

        async function getMicrophone() {
            if (!localStream) {
                try {
                    // Optimized audio constraints for voice clarity (echo cancellation, noise suppression)
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        },
                        video: false
                    });
                } catch (err) {
                    alert('Microphone access denied or not available.');
                    throw err;
                }
            }
            return localStream;
        }

        // Automatically join if the link contains a room ID
        window.addEventListener('load', async () => {
            if (joinId) {
                setupView.classList.add('hidden');
                setStatus('Connecting to room...', 'connecting');
                
                try {
                    await getMicrophone();
                    
                    // Use a slight random delay to ensure PeerJS handles connection cleanly
                    peer = new Peer();

                    peer.on('open', () => {
                        const call = peer.call(joinId, localStream);
                        handleCall(call);
                    });

                    peer.on('error', (err) => {
                        setStatus('Connection failed', '');
                        alert('Error: ' + err.type);
                    });
                } catch (e) {
                    setStatus('Microphone error', '');
                }
            }
        });

        async function createRoom() {
            try {
                setStatus('Initializing...', 'connecting');
                await getMicrophone();

                peer = new Peer();

                peer.on('open', (id) => {
                    const link = window.location.origin + window.location.pathname + '?join=' + id;
                    shareLink.value = link;
                    setupView.classList.add('hidden');
                    shareView.classList.remove('hidden');
                    setStatus('Waiting for peer...', 'connecting');
                });

                // When someone calls this peer
                peer.on('call', (call) => {
                    call.answer(localStream);
                    handleCall(call);
                });

                peer.on('error', (err) => {
                    setStatus('Connection error', '');
                    alert('Error: ' + err.type);
                });

            } catch (e) {
                setStatus('Failed to start', '');
            }
        }

        function handleCall(call) {
            activeCall = call;

            call.on('stream', (stream) => {
                remoteAudio.srcObject = stream;
                shareView.classList.add('hidden');
                callControls.classList.remove('hidden');
                setStatus('Connected', 'connected');
            });

            call.on('close', () => {
                endCall();
                setStatus('Call ended by peer', '');
            });

            call.on('error', () => {
                endCall();
                setStatus('Connection error', '');
            });
        }

        function copyLink() {
            shareLink.select();
            navigator.clipboard.writeText(shareLink.value);
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        let isMuted = false;
        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                muteBtn.textContent = isMuted ? 'Unmute Microphone' : 'Mute Microphone';
                muteBtn.style.borderColor = isMuted ? 'var(--danger-color)' : 'var(--border-color)';
            }
        }

        function endCall() {
            if (activeCall) {
                activeCall.close();
                activeCall = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            remoteAudio.srcObject = null;
            
            shareView.classList.add('hidden');
            callControls.classList.add('hidden');
            setupView.classList.remove('hidden');
            setStatus('Disconnected', '');

            // Clean URL parameters without reloading page
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
