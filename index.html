<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceLink — Secure P2P Audio</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --surface: #111827;
            --surface-hover: #1f2937;
            --border: #374151;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }
        .dot.connected { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot.connecting { background-color: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .dot.error { background-color: var(--danger); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: var(--surface-hover);
            border: 1px solid var(--border);
        }
        button.secondary:hover {
            background-color: var(--border);
        }

        button.danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        button.danger:hover {
            background-color: rgba(239, 68, 68, 0.25);
        }

        .hidden {
            display: none !important;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>VoiceLink</h1>
            <p>Direct browser-to-browser encrypted voice communication.</p>
        </div>

        <div class="status-pill">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">Ready to connect</span>
        </div>

        <!-- Setup Screen -->
        <div id="setupScreen" class="form-group">
            <label for="roomInput">Custom Room Name</label>
            <input type="text" id="roomInput" placeholder="e.g. secure-room-123">
            <button onclick="initializeRoom()">Join / Create Room</button>
        </div>

        <!-- Waiting Screen -->
        <div id="waitingScreen" class="form-group hidden">
            <label>Room Link (Share with peer)</label>
            <input type="text" id="shareLink" readonly onclick="this.select()">
            <button class="secondary" onclick="copyLink()">Copy Invitation Link</button>
        </div>

        <!-- Active Call Screen -->
        <div id="callScreen" class="actions hidden">
            <button id="muteBtn" class="secondary" onclick="toggleMute()">Mute Microphone</button>
            <button class="danger" onclick="endCall()">Disconnect Call</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const setupScreen = document.getElementById('setupScreen');
        const waitingScreen = document.getElementById('waitingScreen');
        const callScreen = document.getElementById('callScreen');
        const roomInput = document.getElementById('roomInput');
        const shareLink = document.getElementById('shareLink');
        const muteBtn = document.getElementById('muteBtn');
        const remoteAudio = document.getElementById('remoteAudio');

        let peer = null;
        let localStream = null;
        let activeCall = null;

        function setStatus(text, state) {
            statusText.textContent = text;
            statusDot.className = 'dot ' + state;
        }

        // Auto-fill room name from URL query if present
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            if (room) {
                roomInput.value = room;
                // Automatically attempt connection if opening an invite link
                initializeRoom();
            }
        });

        async function getMicrophoneStream() {
            if (!localStream) {
                // Production-grade audio constraints for noise reduction and echo suppression
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1
                    },
                    video: false
                });
            }
            return localStream;
        }

        async function initializeRoom() {
            const roomName = roomInput.value.trim();
            if (!roomName) {
                alert('Please enter a valid room name.');
                return;
            }

            setStatus('Accessing microphone...', 'connecting');
            setupScreen.classList.add('hidden');

            try {
                await getMicrophoneStream();
                
                // Construct deterministic peer ID based on custom room name
                const peerId = 'voicelink-' + btoa(roomName).replace(/=/g, '');
                
                peer = new Peer(peerId, {
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                peer.on('open', (id) => {
                    const fullLink = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(roomName);
                    shareLink.value = fullLink;
                    waitingScreen.classList.remove('hidden');
                    setStatus('Waiting for peer to join...', 'connecting');

                    // If someone is already in the room with this ID, handle the collision by trying to call them instead
                    tryCallingPeer(peerId);
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        // Room already exists, so we act as the client calling the host
                        connectToExistingRoom(peerId);
                    } else {
                        setStatus('Connection error: ' + err.type, 'error');
                    }
                });

                peer.on('call', (incomingCall) => {
                    incomingCall.answer(localStream);
                    handleActiveCall(incomingCall);
                });

            } catch (err) {
                setStatus('Microphone access denied', 'error');
                setupScreen.classList.remove('hidden');
            }
        }

        async function tryCallingPeer(hostId) {
            // Give a short window to check if ID registration fails (meaning room exists)
            setTimeout(() => {
                if (!activeCall && peer && peer.disconnected === false) {
                    // We successfully claimed the ID as host, stay waiting
                }
            }, 1000);
        }

        async function connectToExistingRoom(hostId) {
            setStatus('Connecting to room...', 'connecting');
            // Destroy current failed instance and create a fresh client instance
            peer.destroy();
            
            peer = new Peer();
            peer.on('open', () => {
                const call = peer.call(hostId, localStream);
                handleActiveCall(call);
            });

            peer.on('error', () => {
                setStatus('Failed to connect to room', 'error');
                setupScreen.classList.remove('hidden');
            });
        }

        function handleActiveCall(call) {
            activeCall = call;

            call.on('stream', (stream) => {
                remoteAudio.srcObject = stream;
                waitingScreen.classList.add('hidden');
                callScreen.classList.remove('hidden');
                setStatus('Connected (HD Audio)', 'connected');
            });

            call.on('close', () => {
                resetState();
                setStatus('Peer disconnected', '');
            });

            call.on('error', () => {
                resetState();
                setStatus('Call encountered an error', 'error');
            });
        }

        function copyLink() {
            shareLink.select();
            navigator.clipboard.writeText(shareLink.value);
            const btn = waitingScreen.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Copied to Clipboard!';
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        let isMuted = false;
        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                muteBtn.textContent = isMuted ? 'Unmute Microphone' : 'Mute Microphone';
                muteBtn.style.color = isMuted ? 'var(--danger)' : 'var(--text)';
            }
        }

        function endCall() {
            if (activeCall) activeCall.close();
            resetState();
            setStatus('Call ended', '');
        }

        function resetState() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            activeCall = null;
            remoteAudio.srcObject = null;
            
            waitingScreen.classList.add('hidden');
            callScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            
            // Clear search query parameters cleanly
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
